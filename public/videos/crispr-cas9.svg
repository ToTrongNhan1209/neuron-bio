<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="100%" height="100%" style="background:#050507;font-family:'Inter',system-ui,sans-serif;">
    <defs>
      <radialGradient id="vignette" cx="50%" cy="50%" r="70%">
        <stop offset="30%" stop-color="#000000" stop-opacity="0"/>
        <stop offset="100%" stop-color="#000000" stop-opacity="0.85"/>
      </radialGradient>
      <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#ffffff"/>
        <stop offset="100%" stop-color="#cccccc"/>
      </linearGradient>
      <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#22c55e"/>
        <stop offset="100%" stop-color="#ffffff"/>
      </linearGradient>
      <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
        <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1"/>
      </pattern>
    </defs>

    <!-- Grid background -->
    <rect width="1280" height="720" fill="#070709"/>
    <rect width="1280" height="720" fill="url(#grid)"/>

    <!-- Scientific Graphic in center/right -->
    <g transform="translate(680, 100)">
      
  <!-- Double Helix DNA Strand -->
  <path d="M 100 180 Q 200 120 300 240 T 500 240" fill="none" stroke="#ffffff" stroke-width="3.5"/>
  <path d="M 100 280 Q 200 340 300 240 T 500 240" fill="none" stroke="#ffffff" stroke-width="3.5"/>

  <!-- Base pairs -->
  <line x1="150" y1="160" x2="150" y2="300" stroke="rgba(255,255,255,0.4)" stroke-width="2"/>
  <line x1="220" y1="150" x2="220" y2="310" stroke="rgba(255,255,255,0.4)" stroke-width="2"/>
  <line x1="380" y1="190" x2="380" y2="290" stroke="rgba(255,255,255,0.4)" stroke-width="2"/>

  <!-- Cas9 Molecular Scissors Body -->
  <rect x="250" y="160" width="120" height="160" rx="30" fill="none" stroke="#22c55e" stroke-width="3" stroke-dasharray="8 6"/>
  
  <!-- Cleavage site cut -->
  <line x1="300" y1="120" x2="300" y2="360" stroke="#ef4444" stroke-width="3.5" stroke-dasharray="6 4"/>
  <circle cx="300" cy="240" r="9" fill="#ef4444"/>
  
    </g>

    <!-- Dark vignette overlay for depth -->
    <rect width="1280" height="720" fill="url(#vignette)"/>

    <!-- Brand Logo in Top Right corner -->
    <g transform="translate(1030, 48)">
      <image href="/logo.png" width="180" height="42" />
    </g>

    <!-- Left side typography -->
    <g transform="translate(80, 520)">
      <!-- Kicker -->
      <text x="0" y="0" fill="#a1a1aa" font-size="24" font-weight="600" letter-spacing="4" text-transform="uppercase">CÔNG NGHỆ GEN</text>
      <!-- Headline -->
      <text x="0" y="55" fill="url(#textGrad)" font-size="52" font-weight="900" letter-spacing="-1">CÂY KÉO CRISPR-CAS9</text>
      <!-- Formula or key data badge -->
      <g transform="translate(0, 105)">
        <rect x="0" y="-30" width="445" height="42" rx="21" fill="rgba(34, 197, 94, 0.12)" stroke="#22c55e" stroke-width="1.5" />
        <text x="20" y="-3" fill="#22c55e" font-size="20" font-weight="700" font-family="'JetBrains Mono', monospace">sgRNA Guide | PAM 5′-NGG-3′</text>
      </g>
    </g>
  </svg>