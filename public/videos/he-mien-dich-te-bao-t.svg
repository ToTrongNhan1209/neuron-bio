<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="100%" height="100%" style="background:#050507;font-family:'Inter',system-ui,sans-serif;">
    <defs>
      <radialGradient id="vignette" cx="50%" cy="50%" r="70%">
        <stop offset="30%" stop-color="#000000" stop-opacity="0"/>
        <stop offset="100%" stop-color="#000000" stop-opacity="0.85"/>
      </radialGradient>
      <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#ffffff"/>
        <stop offset="100%" stop-color="#cccccc"/>
      </linearGradient>
      <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#3b82f6"/>
        <stop offset="100%" stop-color="#ffffff"/>
      </linearGradient>
      <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
        <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1"/>
      </pattern>
    </defs>

    <!-- Grid background -->
    <rect width="1280" height="720" fill="#070709"/>
    <rect width="1280" height="720" fill="url(#grid)"/>

    <!-- Scientific Graphic in center/right -->
    <g transform="translate(680, 100)">
      
  <!-- Target cell & T-cell synapse -->
  <circle cx="180" cy="240" r="130" fill="none" stroke="rgba(239,68,68,0.4)" stroke-width="3"/>
  <circle cx="180" cy="240" r="100" fill="rgba(239,68,68,0.05)"/>
  
  <circle cx="380" cy="240" r="110" fill="none" stroke="rgba(59,130,246,0.6)" stroke-width="3"/>
  <circle cx="380" cy="240" r="80" fill="rgba(59,130,246,0.08)"/>

  <!-- Immunological Synapse Contact Zone -->
  <line x1="280" y1="170" x2="280" y2="310" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
  
  <!-- Receptors & Perforin bursts -->
  <circle cx="280" cy="210" r="7" fill="#22c55e"/>
  <circle cx="280" cy="240" r="7" fill="#22c55e"/>
  <circle cx="280" cy="270" r="7" fill="#22c55e"/>

  <!-- Perforin Granzyme spark trail -->
  <circle cx="220" cy="220" r="4" fill="#ef4444"/>
  <circle cx="200" cy="250" r="5" fill="#ef4444"/>
  <circle cx="230" cy="260" r="4" fill="#ef4444"/>
  
    </g>

    <!-- Dark vignette overlay for depth -->
    <rect width="1280" height="720" fill="url(#vignette)"/>

    <!-- Brand Logo in Top Right corner -->
    <g transform="translate(1030, 48)">
      <image href="/logo.png" width="180" height="42" />
    </g>

    <!-- Left side typography -->
    <g transform="translate(80, 520)">
      <!-- Kicker -->
      <text x="0" y="0" fill="#a1a1aa" font-size="24" font-weight="600" letter-spacing="4" text-transform="uppercase">MIỄN DỊCH HỌC</text>
      <!-- Headline -->
      <text x="0" y="55" fill="url(#textGrad)" font-size="52" font-weight="900" letter-spacing="-1">TẾ BÀO T & CUỘC CHIẾN</text>
      <!-- Formula or key data badge -->
      <g transform="translate(0, 105)">
        <rect x="0" y="-30" width="430" height="42" rx="21" fill="rgba(34, 197, 94, 0.12)" stroke="#3b82f6" stroke-width="1.5" />
        <text x="20" y="-3" fill="#3b82f6" font-size="20" font-weight="700" font-family="'JetBrains Mono', monospace">TCR Receptor | CD8+ Killer</text>
      </g>
    </g>
  </svg>